padding:0 1.2rem;line-height:1.75;color:#222}h1{font-size:1.5rem}h2{font-size:1.1rem;margin-top:2rem}
</style></head><body><h1>개인정보처리방침</h1><p>Volcano Uploader(이하 「도구」)는 개인이 자신의 유튜브 채널에 영상을 올리기 위해 쓰는 도구다.</p><h2>수집하는 것</h2><p>도구는 개인정보를 수집·저장·공유하지 않는다.</p><h2>권한</h2><p>도구는 <code>youtube.upload</code> 권한만 쓴다. 이 권한은 본인 계정의 채널에 영상을 올리는 데에만 쓰인다.</p><h2>보관</h2><p>구글이 준 인증 토큰은 사용자의 컴퓨터에만 저장된다. 어떤 서버로도 보내지 않는다.</p><h2>철회</h2><p>구글 계정 설정에서 언제든 권한을 끊을 수 있다.</p></body></html>
